[project]
name = "coding-agent-harness"
version = "0.1.0"
description = "Argus - a minimal coding agent, built by following avbiswas/neural-code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.49.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "pillow>=13.0.0",
    "textual>=8.2.8",
]

[project.scripts]
argus = "argus.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]
